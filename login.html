<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apollo University RMS - Login & Register</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

:root {
    --primary: #0F766E;
    --primary-dark: #115E59;
    --bg-light: #F4F7F6;
    --card-bg: #FFFFFF;
    --text-dark: #1F2937;
    --text-muted: #6B7280;
    --border-color: #D1D5DB;
}

body {
    background: var(--bg-light);
    color: var(--text-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.auth-card {
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 460px;
    padding: 30px 25px;
    border-top: 5px solid var(--primary);
}

.auth-header {
    text-align: center;
    margin-bottom: 20px;
}

.auth-header img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    margin-bottom: 8px;
    object-fit: cover;
}

.auth-header h1 {
    font-size: 19px;
    color: var(--primary);
}

.auth-header p {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 3px;
}

.tabs {
    display: flex;
    border-bottom: 2px solid #E5E7EB;
    margin-bottom: 18px;
}

.tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 10px;
    font-weight: bold;
    font-size: 14px;
    color: var(--text-muted);
    cursor: pointer;
    text-align: center;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
}

.tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

.form-group {
    margin-bottom: 14px;
}

label {
    display: block;
    font-size: 12.5px;
    font-weight: bold;
    color: var(--primary-dark);
    margin-bottom: 5px;
}

input, select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 13.5px;
    outline: none;
}

input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
}

.btn-submit {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 11px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
    transition: 0.2s;
}

.btn-submit:hover {
    background: var(--primary-dark);
}

.alert-msg {
    display: none;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 15px;
}

.alert-error {
    background: #FEE2E2;
    color: #B91C1C;
    border: 1px solid #FECACA;
}

.alert-success {
    background: #D1FAE5;
    color: #065F46;
    border: 1px solid #A7F3D0;
}

.role-chips-box {
    background: #F8FAFC;
    border: 1px dashed #CBD5E1;
    padding: 12px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 12px;
}

.role-chips-box h4 {
    color: var(--primary-dark);
    font-size: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chip-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.role-chip {
    background: #E0F2FE;
    color: #0369A1;
    border: 1px solid #BAE6FD;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.role-chip:hover {
    background: #0284C7;
    color: white;
}
</style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <img src="logo.png" alt="Apollo RMS" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1046/1046269.png'">
        <h1>Apollo University</h1>
        <p>Resource Management System (CampusFlow)</p>
    </div>

    <div class="tabs">
        <button type="button" class="tab-btn active" onclick="switchAuthTab('login')">Sign In</button>
        <button type="button" class="tab-btn" onclick="switchAuthTab('register')">Register New Account</button>
    </div>

    <div id="alertBox" class="alert-msg"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>University Email *</label>
            <input type="email" id="loginEmail" placeholder="e.g. admin@apollo.edu" required>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="regName" placeholder="e.g. Dr. Rajesh Sharma" required>
        </div>
        <div class="form-group">
            <label>University Email *</label>
            <input type="email" id="regEmail" placeholder="e.g. rajesh@apollo.edu" required>
        </div>
        <div class="form-group">
            <label>Assigned Campus Role *</label>
            <select id="regRole" required>
                <option value="Administrator">Administrator</option>
                <option value="Unit Head">Unit Head</option>
                <option value="Transport Officer">Transport Officer</option>
                <option value="Teaching Faculty">Teaching Faculty</option>
                <option value="Program Coordinator">Program Coordinator</option>
                <option value="Dean">Dean</option>
                <option value="Non-Teaching Staff">Non-Teaching Staff</option>
            </select>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <!-- QUICK AUTOFILL ROLES FOR TESTING -->
    <div class="role-chips-box">
        <h4>⚡ Quick Testing Login (1-Click Fill):</h4>
        <div class="chip-grid">
            <button type="button" class="role-chip" onclick="quickFill('admin@apollo.edu', 'Admin@123')">👑 Administrator</button>
            <button type="button" class="role-chip" onclick="quickFill('transport@apollo.edu', 'Transport@123')">🚌 Transport Officer</button>
            <button type="button" class="role-chip" onclick="quickFill('faculty@apollo.edu', 'Faculty@123')">👩‍🏫 Teaching Faculty</button>
            <button type="button" class="role-chip" onclick="quickFill('pc@apollo.edu', 'PC@123')">📋 Program Coordinator</button>
            <button type="button" class="role-chip" onclick="quickFill('dean@apollo.edu', 'Dean@123')">🎓 Dean</button>
            <button type="button" class="role-chip" onclick="quickFill('staff@apollo.edu', 'Staff@123')">🔧 Non-Teaching Staff</button>
            <button type="button" class="role-chip" onclick="quickFill('unithead@apollo.edu', 'UnitHead@123')">🏛️ Unit Head</button>
        </div>
    </div>
</div>

<script>
function showAlert(msg, isError = true) {
    const box = document.getElementById('alertBox');
    box.innerText = msg;
    box.className = `alert-msg ${isError ? 'alert-error' : 'alert-success'}`;
    box.style.display = 'block';
}

function switchAuthTab(tab) {
    document.getElementById('alertBox').style.display = 'none';
    const tabs = document.querySelectorAll('.tab-btn');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    if (tab === 'login') {
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
    } else {
        tabs[1].classList.add('active');
        tabs[0].classList.remove('active');
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
    }
}

function quickFill(email, password) {
    switchAuthTab('login');
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = password;
    showAlert(`Autofilled credentials for ${email}. Click "Sign In" to proceed.`, false);
}

async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!data.success) {
            showAlert(data.message, true);
            return;
        }

        localStorage.setItem('apollo_token', data.token);
        localStorage.setItem('apollo_user', JSON.stringify(data.user));
        localStorage.setItem('apollo_active_role', data.user.role);
        showAlert(`Welcome ${data.user.fullName} (${data.user.role})! Redirecting...`, false);

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 600);
    } catch (err) {
        showAlert('Unable to connect to backend server. Make sure server.js is running.', true);
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const fullName = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const role = document.getElementById('regRole').value;
    const password = document.getElementById('regPassword').value;

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, email, password, role })
        });
        const data = await res.json();
        if (!data.success) {
            showAlert(data.message, true);
            return;
        }

        localStorage.setItem('apollo_token', data.token);
        localStorage.setItem('apollo_user', JSON.stringify(data.user));
        localStorage.setItem('apollo_active_role', data.user.role);
        showAlert(`Registration successful for ${data.user.fullName} (${data.user.role})! Redirecting...`, false);

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 600);
    } catch (err) {
        showAlert('Unable to connect to backend server. Make sure server.js is running.', true);
    }
}
</script>

</body>
</html>
